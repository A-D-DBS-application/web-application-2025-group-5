{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 px-4">

    <!-- Logo + titel -->
    <div class="mb-8 flex flex-col items-center">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="WineWay logo"
             class="h-48 w-auto mb-4 drop-shadow-lg">

        <h1 class="text-2xl font-bold text-gray-800">WineWay</h1>
        <p class="text-gray-600 mt-1 mb-2">Inloggen om je leveringen te beheren</p>
    </div>

    <!-- Login card -->
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg border border-gray-200">
        <form method="post">

            <!-- Username field -->
            <label class="block text-sm font-medium text-gray-700 mb-1">Naam</label>
            <input 
                type="text" 
                name="name" 
                placeholder="Typ je naam" 
                required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />

            <!-- Submit button -->
            <button 
                type="submit"
                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2 rounded-lg transition">
                Sign in
            </button>
        </form>
    </div>

</div>
{% endblock %}
