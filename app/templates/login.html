{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 px-4">

    <!-- Icon -->
    <div class="mb-6">
        <div class="bg-blue-600 text-white w-16 h-16 rounded-xl flex items-center justify-center shadow">
            <!-- Een simpel truck-icoon van Heroicons (HTML versie) -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 17a2 2 0 11-4 0 2 2 0 014 0zm10 2a2 2 0 100-4 2 2 0 000 4zM3 5h12v11H3V5zm12 4h4l2 3v4h-6V9z"/>
            </svg>
        </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold text-gray-800">Route Planner</h1>
    <p class="text-gray-600 mt-1 mb-8">Inloggen om je leveringen te beheren</p>

    <!-- Login card -->
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg border border-gray-200">
        <form method="post">

            <!-- Username field -->
            <label class="block text-sm font-medium text-gray-700 mb-1">Naam</label>
            <input 
                type="text" 
                name="name" 
                placeholder="Typ je naam" 
                required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />

            <!-- Submit button -->
            <button 
                type="submit"
                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2 rounded-lg transition">
                Sign in
            </button>
        </form>
    </div>

</div>
{% endblock %}
