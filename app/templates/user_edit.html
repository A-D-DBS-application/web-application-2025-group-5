{% extends "base.html" %}
{% block title %}Gebruiker Bewerken{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="bg-white w-full max-w-lg p-8 rounded-2xl shadow-lg border border-gray-200 relative">

    <!-- Sluit-knop -->
    <a href="{{ url_for('admin.dashboard') }}"
       class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl">
      &times;
    </a>

    <h2 class="text-xl font-semibold mb-1 text-gray-900">Gebruiker Bewerken</h2>
    <p class="text-gray-500 mb-6 text-sm">Pas accountgegevens aan</p>

    <form method="post">

      <!-- Naam -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Naam *</label>
      <input type="text" name="name" value="{{ user.name }}" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Email -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
      <input type="email" name="email" value="{{ user.email }}" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Rollen -->
      <label class="block text-sm font-medium text-gray-700 mb-2">Rollen *</label>

      <div class="space-y-2 mb-6">

        <!-- Admin -->
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" name="roles" value="admin"
                 {% if 'admin' in user.get_roles() %}checked{% endif %}
                 class="w-5 h-5 border-gray-300 rounded">
          <span class="text-gray-700 text-sm">Admin</span>
        </label>

        <!-- Driver -->
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" name="roles" value="driver"
                 {% if 'driver' in user.get_roles() %}checked{% endif %}
                 class="w-5 h-5 border-gray-300 rounded">
          <span class="text-gray-700 text-sm">Driver</span>
        </label>

      </div>

      <!-- Status -->
      <label class="flex items-center gap-3 mb-6 cursor-pointer">
        <input type="checkbox" name="is_active"
               {% if user.is_active %}checked{% endif %}
               class="w-5 h-5 border-gray-300 rounded">
        <span class="text-gray-700 text-sm">Account actief</span>
      </label>

      <button type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2 rounded-lg">
        Wijzigingen Opslaan
      </button>

    </form>

  </div>
</div>
{% endblock %}
