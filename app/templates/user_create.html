{% extends "base.html" %}
{% block title %}Nieuw Account{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="bg-white w-full max-w-lg p-8 rounded-2xl shadow-lg border border-gray-200 relative">

    <!-- Sluit-knop -->
    <a href="{{ url_for('admin.dashboard') }}"
       class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl">
      &times;
    </a>

    <h2 class="text-xl font-semibold mb-1 text-gray-900">Nieuw Account</h2>
    <p class="text-gray-500 mb-6 text-sm">Voeg een nieuwe gebruiker toe</p>

    <form method="post">

      <!-- Naam -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Naam *</label>
      <input type="text" name="name" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Email -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
      <input type="email" name="email" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Rol -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Rol *</label>
      <select name="role"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-6" required>
        <option value="driver">Driver</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2 rounded-lg">
        Account Toevoegen
      </button>

    </form>

  </div>
</div>
{% endblock %}
