{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto mt-10 p-6 bg-white shadow-md rounded-lg border border-slate-200">

  <h2 class="text-xl font-semibold text-slate-900 mb-1">
    Order #{{ order.order_id }} bewerken
  </h2>
  <p class="text-sm text-slate-500 mb-6">
    Pas de gegevens van deze bestelling aan.
  </p>

  <form method="POST">

    <!-- Aantallen -->
    <div class="grid grid-cols-3 gap-4 mt-4">

      <div>
        <label class="block text-sm font-medium text-slate-700">Vaten</label>
        <input type="number" id="qty_vat" name="qty_vat"
               value="{{ order.qty_vat }}"
               class="mt-1 w-full px-3 py-2 border rounded-lg border-slate-300 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Flessen</label>
        <input type="number" id="qty_fles" name="qty_fles"
               value="{{ order.qty_fles }}"
               class="mt-1 w-full px-3 py-2 border rounded-lg border-slate-300 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">BIBs</label>
        <input type="number" id="qty_bib" name="qty_bib"
               value="{{ order.qty_bib }}"
               class="mt-1 w-full px-3 py-2 border rounded-lg border-slate-300 focus:ring-blue-500" />
      </div>

    </div>

    <!-- Automatisch berekend gewicht -->
    <label class="block text-sm font-medium text-slate-700 mt-4">Gewicht (kg)</label>
    <input type="number" id="auto_weight" name="total_weight_kg"
           value="{{ order.total_weight_kg }}"
           step="0.01"
           class="mt-1 w-full px-3 py-2 border rounded-lg bg-slate-100 
                  text-slate-700 border-slate-300"
           readonly />

    <!-- Leverdatum -->
    <label class="block text-sm font-medium text-slate-700 mt-4">Leverdatum</label>
    <input type="date" name="delivery_date"
           value="{{ order.delivery_window_end.strftime('%Y-%m-%d') }}"
           class="mt-1 w-full px-3 py-2 border rounded-lg border-slate-300 focus:ring-blue-500" />

    <!-- Order status select -->
    <label class="block text-sm font-medium text-slate-700 mt-4">Orderstatus</label>
    <select name="order_status"
            class="mt-1 w-full px-3 py-2 border rounded-lg border-slate-300 focus:ring-blue-500">
      <option value="pending"     {% if order.order_status == "pending" %}selected{% endif %}>Pending</option>
      <option value="processing"  {% if order.order_status == "processing" %}selected{% endif %}>Processing</option>
      <option value="delivered"   {% if order.order_status == "delivered" %}selected{% endif %}>Delivered</option>
      <option value="cancelled"   {% if order.order_status == "cancelled" %}selected{% endif %}>Cancelled</option>
    </select>

    <!-- Payment status -->
    <label class="block text-sm font-medium text-slate-700 mt-4">Betalingsstatus</label>
    <select name="payment_status"
            class="mt-1 w-full px-3 py-2 border rounded-lg border-slate-300 focus:ring-blue-500">
      <option value="pending" {% if order.payment_status == "pending" %}selected{% endif %}>Pending</option>
      <option value="paid"    {% if order.payment_status == "paid" %}selected{% endif %}>Betaald</option>
      <option value="overdue" {% if order.payment_status == "overdue" %}selected{% endif %}>Te laat</option>
    </select>

    <!-- Buttons -->
    <div class="flex justify-end gap-3 mt-8">

      <a href="{{ url_for('admin.dashboard') }}"
         class="px-4 py-2 rounded-lg bg-slate-200 text-slate-800 hover:bg-slate-300">
        Annuleren
      </a>

      <button type="submit"
              class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">
        Opslaan
      </button>

    </div>

  </form>

</div>

<!-- Automatische gewichtsberekening -->
<script>
function updateWeight() {
    const vat  = parseInt(document.getElementById("qty_vat").value  || 0);
    const fles = parseInt(document.getElementById("qty_fles").value || 0);
    const bib  = parseInt(document.getElementById("qty_bib").value  || 0);

    // Gewichtformule
    const totaal = vat * 65 + fles * 1.5 + bib * 4;

    // Vul het readonly veld in
    document.getElementById("auto_weight").value = totaal.toFixed(2);
}

// Events koppelen
["qty_vat", "qty_fles", "qty_bib"].forEach(id => {
    document.getElementById(id).addEventListener("input", updateWeight);
});

// Eerste berekening bij openen
updateWeight();
</script>

{% endblock %}
