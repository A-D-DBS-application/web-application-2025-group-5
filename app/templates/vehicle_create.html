{% extends "base.html" %}
{% block title %}Nieuw Voertuig{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="bg-white w-full max-w-lg p-8 rounded-2xl shadow-lg border border-gray-200 relative">

    <!-- Sluit-knop -->
    <a href="{{ url_for('admin.dashboard') }}"
       class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl leading-none">
        &times;
    </a>

    <h2 class="text-xl font-semibold mb-1 text-gray-900">Nieuw Voertuig</h2>
    <p class="text-gray-500 mb-6 text-sm">Voeg een nieuw voertuig toe</p>

    <form method="post">

      <!-- License Plate -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Kenteken *</label>
      <input type="text" name="license_plate" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4" />

      <!-- Capacity -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Capaciteit (kg) *</label>
      <input type="number" name="capacity_kg" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4" />

      <!-- Model -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Model</label>
      <input type="text" name="model"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4" />

      <!-- Brand -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Merk *</label>
      <input type="text" name="brand" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4" />

      <!-- Active -->
      <label class="flex items-center gap-2 mb-6">
        <input type="checkbox" name="is_active" checked class="w-5 h-5" />
        <span class="text-sm text-gray-700">Actief</span>
      </label>

      <button type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2 rounded-lg">
        Voertuig Toevoegen
      </button>

    </form>

  </div>
</div>
{% endblock %}
