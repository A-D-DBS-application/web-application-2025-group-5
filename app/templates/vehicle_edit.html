{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white shadow-md rounded-xl p-6">

    <h1 class="text-2xl font-semibold text-slate-800 mb-2">
        Voertuig bewerken
    </h1>
    <p class="text-slate-500 text-sm mb-6">
        Pas de gegevens van het voertuig aan en sla je wijzigingen op.
    </p>

    <form method="POST" class="space-y-5">

        <!-- Nummerplaat -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nummerplaat</label>
            <input type="text" name="license_plate" required
                   value="{{ vehicle.license_plate }}"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Merk -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Merk</label>
            <input type="text" name="brand" required
                   value="{{ vehicle.brand }}"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Model -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Model</label>
            <input type="text" name="model"
                   value="{{ vehicle.model }}"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Kleur -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Kleur</label>
            <input type="text" name="color"
                   value="{{ vehicle.color }}"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Capaciteit -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Capaciteit (kg)</label>
            <input type="number" name="capacity_kg" required
                   value="{{ vehicle.capacity_kg }}"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Brandstof -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Brandstof</label>
            <input type="text" name="fuel_type"
                   value="{{ vehicle.fuel_type }}"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Actief -->
        <div class="flex items-center gap-2">
            <input type="checkbox" name="is_active"
                   {% if vehicle.is_active %} checked {% endif %}
                   class="h-4 w-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
            <label class="text-sm text-slate-700">Actief voertuig</label>
        </div>

        <!-- Buttons -->
        <div class="flex justify-between pt-4">
            <a href="{{ url_for('admin.dashboard') }}"
               class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50">
                Annuleren
            </a>

            <button type="submit"
                    class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">
                Wijzigingen opslaan
            </button>
        </div>

    </form>
</div>
{% endblock %}
