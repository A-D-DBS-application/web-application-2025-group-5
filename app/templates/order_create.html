{% extends "base.html" %}
{% block title %}Nieuwe Order{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="bg-white w-full max-w-2xl p-8 rounded-2xl shadow-lg border border-gray-200">

    <h2 class="text-xl font-semibold mb-1 text-gray-900">Nieuwe Order</h2>
    <p class="text-gray-500 mb-6 text-sm">Voeg een nieuwe bestelling toe</p>

    <form method="post">

      <!-- Klant ID -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Klant ID *</label>
      <input type="number" name="customer_id" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Adres -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Bezorgadres *</label>
      <input type="text" name="delivery_address" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Telefoon -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Telefoon *</label>
      <input type="text" name="delivery_phone" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Tijdvenster Start -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Start Tijdvenster *</label>
      <input type="datetime-local" name="delivery_window_start" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Tijdvenster Eind -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Eind Tijdvenster *</label>
      <input type="datetime-local" name="delivery_window_end" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Gewicht -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Gewicht (kg)</label>
      <input type="number" name="total_weight_kg" step="0.01"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- Order Status -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Order Status</label>
      <select name="order_status"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5">
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="delivered">Delivered</option>
      </select>

      <!-- Payment Status -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Betaal Status</label>
      <select name="payment_status"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5">
        <option value="pending">Pending</option>
        <option value="paid">Betaald</option>
      </select>

      <button type="submit"
              class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2 rounded-lg">
        Toevoegen
      </button>

    </form>
  </div>
</div>
{% endblock %}
