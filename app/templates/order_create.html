{% extends "base.html" %}
{% block title %}Nieuwe Order{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="bg-white w-full max-w-2xl p-8 rounded-2xl shadow-lg border border-gray-200 relative">

    <!-- Sluitknop -->
    <a href="{{ url_for('admin.dashboard') }}"
       class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl leading-none">
        &times;
    </a>

    <h2 class="text-xl font-semibold mb-1 text-gray-900">Nieuwe Order</h2>
    <p class="text-gray-500 mb-6 text-sm">Voeg een nieuwe bestelling toe</p>

    <form method="post">

      <!-- KLANT ZOEKFUNCTIE -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Klant *</label>

      <div class="relative mb-5">
        <input type="text" id="customer_search"
               placeholder="Zoek klant..."
               class="w-full border border-gray-300 rounded-lg px-3 py-2"
               autocomplete="off">

        <div id="customer_results"
             class="absolute left-0 right-0 bg-white border border-gray-300 rounded-lg mt-1 hidden z-20 max-h-60 overflow-y-auto">
        </div>
      </div>

      <input type="hidden" name="customer_id" id="customer_id" required />

      <!-- ADRES -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Bezorgadres *</label>
      <input type="text" id="delivery_address" name="delivery_address" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- TELEFOON -->
      <label class="block text-sm font-medium text-gray-700 mb-1">Telefoon *</label>
      <input type="text" id="delivery_phone" name="delivery_phone" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- DATUMS (desktop = 2 kolommen, gsm = 1) -->
      <div class="grid grid-cols-2 max-md:grid-cols-1 gap-4 mb-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Eerste mogelijke leverdatum *
          </label>
          <input type="date" name="delivery_window_start" required
                 value="{{ default_date }}"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Uiterste leverdatum *
          </label>
          <input type="date" name="delivery_window_end" required
                 class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
      </div>

      <!-- UREN (desktop = 2 kolommen, gsm = 1) -->
      <div class="grid grid-cols-2 max-md:grid-cols-1 gap-4 mb-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Levering vanaf (uur)
          </label>
          <input type="time" name="delivery_hour_start" value="08:00"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Levering tot (uur)
          </label>
          <input type="time" name="delivery_hour_end" value="17:00"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
      </div>

      <!-- PRODUCTEN (desktop = 3 kolommen, gsm = 1) -->
      <div class="grid grid-cols-3 max-md:grid-cols-1 gap-4 mb-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Aantal vaten (60L – 65 kg)
          </label>
          <input type="number" name="qty_vat" min="0"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Aantal flessen (75cl – 1,5 kg)
          </label>
          <input type="number" name="qty_fles" min="0"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Aantal BIBs (3L – 4 kg)
          </label>
          <input type="number" name="qty_bib" min="0"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
      </div>

      <!-- AUTOMATISCH GEWICHT -->
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Automatisch Gewicht (kg)
      </label>
      <input type="number" id="auto_weight" readonly
             class="w-full bg-gray-100 border border-gray-300 rounded-lg px-3 py-2 mb-5" />

      <!-- STATUSSEN -->
      <input type="hidden" name="order_status" value="confirmed">

      <label class="block text-sm font-medium text-gray-700 mb-1">
        Betaal Status
      </label>
      <select name="payment_status"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5">
        <option value="pending">Pending</option>
        <option value="paid">Betaald</option>
      </select>

      <button type="submit"
              class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2 rounded-lg">
        Toevoegen
      </button>

    </form>

    <!-- JS ongewijzigd -->
    <script>
      const searchInput = document.getElementById("customer_search");
      const resultsBox = document.getElementById("customer_results");

      searchInput.addEventListener("input", async () => {
        const q = searchInput.value.trim();
        if (q.length < 2) {
          resultsBox.classList.add("hidden");
          return;
        }

        const response = await fetch(`/admin/customers/search?q=` + q);
        const customers = await response.json();

        resultsBox.innerHTML = "";
        resultsBox.classList.remove("hidden");

        if (customers.length === 0) {
          resultsBox.innerHTML = "<div class='p-2 text-gray-500'>Geen resultaten</div>";
          return;
        }

        customers.forEach(c => {
          const item = document.createElement("div");
          item.className = "p-2 hover:bg-gray-100 cursor-pointer border-b";
          item.textContent = `${c.name} – ${c.address}`;

          item.onclick = () => {
            customer_id.value = c.id;
            delivery_address.value = c.address;
            delivery_phone.value = c.phone;
            searchInput.value = c.name;
            resultsBox.classList.add("hidden");
          };

          resultsBox.appendChild(item);
        });
      });

      function updateWeight() {
        const vat = parseInt(document.querySelector('[name="qty_vat"]').value || 0);
        const fles = parseInt(document.querySelector('[name="qty_fles"]').value || 0);
        const bib = parseInt(document.querySelector('[name="qty_bib"]').value || 0);
        auto_weight.value = (vat * 65 + fles * 1.5 + bib * 4).toFixed(2);
      }

      ['qty_vat','qty_fles','qty_bib'].forEach(n =>
        document.querySelector(`[name="${n}"]`).addEventListener('input', updateWeight)
      );
    </script>

  </div>
</div>
{% endblock %}
